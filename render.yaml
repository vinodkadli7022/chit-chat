services:
  - type: web
    name: chit-chat
    runtime: node
    plan: free
    buildCommand: "npm run install:all && cd server && npx prisma generate && cd .. && npm run build"
    startCommand: "cd server && npx prisma db push && npm run seed && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
